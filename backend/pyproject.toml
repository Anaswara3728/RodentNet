[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rodentnet"
version = "0.1.0"
description = "Privacy-preserving federated learning for CIFAR10 with FedPer, MPC secure aggregation, and threshold ML-DSA-65 handshakes."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "flwr[simulation]>=1.8",
  "torch>=2.2",
  "torchvision>=0.17",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pqc = ["pqcrypto>=0.3.4"]
dev = ["httpx>=0.27", "pytest>=8.2", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
